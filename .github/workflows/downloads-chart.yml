name: downloads-chart

# Refreshes docs/img/downloads-cumulative.svg (npm registry cumulative downloads)
# and commits it back so the READMEs always show the latest curve.

on:
  schedule:
    - cron: '17 1 * * *' # daily 01:17 UTC — off the hour, GitHub throttles on-the-hour crons
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/gen-downloads-chart.mjs
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/img/downloads-cumulative.svg
          git diff --cached --quiet || (git commit -m "chore: update npm downloads chart [skip ci]" && git push)
